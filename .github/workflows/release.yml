# Gera o "Phael Tech Provision.exe" no Windows e anexa à release.
# Como publicar uma versão: GitHub -> Releases -> "Draft a new release" -> tag v2.0.1 -> Publish.
name: Publicar versão

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aplicar versão da tag
        run: python tools/set_version.py "${{ github.event.release.tag_name }}"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean PhaelTechProvision.spec

      - name: Preparar arquivo
        shell: pwsh
        run: |
          Copy-Item "dist/Phael Tech Provision.exe" "dist/PhaelTechProvision.exe"
          (Get-FileHash dist/PhaelTechProvision.exe -Algorithm SHA256).Hash.ToLower() | Out-File dist/PhaelTechProvision.exe.sha256 -Encoding ascii

      - name: Anexar à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/PhaelTechProvision.exe
            dist/PhaelTechProvision.exe.sha256
