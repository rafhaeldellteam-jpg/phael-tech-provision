# Gera o "Phael Tech Provision.exe" no Windows e anexa à release.
# Como publicar uma versão (qualquer uma das duas):
#   - enviar uma tag:  git tag v2.0.1 && git push origin v2.0.1
#   - ou no site: Releases -> "Draft a new release" -> tag v2.0.1 -> Publish (o site cria a tag e dispara o build)
name: Publicar versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aplicar versão da tag
        run: python tools/set_version.py "${{ github.event.release.tag_name || github.ref_name }}"

      - name: Preparar assinatura digital (se o certificado estiver configurado)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host "Sem certificado: o .exe sai sem assinatura."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'assinatura.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGN_PFX_PASSWORD)
          # o programa passa a aceitar atualizações SÓ assinadas por este certificado
          python tools/set_version.py --thumbprint $cert.Thumbprint
          # certificado público embutido, para a opção "confiar no certificado" nas máquinas
          [IO.File]::WriteAllBytes('Recursos/phaeltech.cer', $cert.Export('Cert'))
          "SIGN_PFX=$pfx" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Assinatura configurada: $($cert.Subject) ($($cert.Thumbprint))"

      - name: Baixar drivers de Wi-Fi Lenovo (catálogo oficial, versões mais novas)
        shell: pwsh
        continue-on-error: true
        run: |
          ./tools/baixar_drivers_lenovo.ps1 -Destino 'Recursos/Drivers Lenovo'
          $l = (Get-Content 'Recursos/Drivers Lenovo/LEIA-ME.txt') -join ' || '
          $t = [math]::Round(((Get-ChildItem 'Recursos/Drivers Lenovo' -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "::notice title=Wi-Fi Lenovo ($t MB)::$l"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean PhaelTechProvision.spec

      - name: Assinar o executável
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $env:SIGN_PFX /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Phael Tech Provision" "dist/Phael Tech Provision.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar" }
          Remove-Item $env:SIGN_PFX -Force

      - name: Preparar arquivo
        shell: pwsh
        run: |
          Copy-Item "dist/Phael Tech Provision.exe" "dist/PhaelTechProvision.exe"
          (Get-FileHash dist/PhaelTechProvision.exe -Algorithm SHA256).Hash.ToLower() | Out-File dist/PhaelTechProvision.exe.sha256 -Encoding ascii

      - name: Anexar à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Phael Tech Provision ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/PhaelTechProvision.exe
            dist/PhaelTechProvision.exe.sha256
